[tool.poetry]
name = "pipe_failure_detection"
version = "0.0.1"
description = "In the following repository you can find the detection of defect location of metal pipes with machine learning approaches."
license = "Unlicense"
authors = ["R.Shcherbakov <some_email@mail.com>"]
readme = "README.md"
include = ["LICENSE"]

[tool.poetry.dependencies]
python = "~3.10"
catboost = "*"
clearml = "*"
numpy = "*"
pandas = "*"
pyarrow = "*"
pydantic = "*"
pydantic-settings = "*"
scikit-learn = "*"
tsfresh = "^0.20.3"
lightgbm = "^4.5.0"

[tool.poetry.group.dev.dependencies]
evidently = "^0.4.38"
optuna = "^4.0.0"

[tool.poetry.group.test.dependencies]
ipykernel = "*"
black = "*"
flakehell = "*"
isort = "*"
mypy = "*"
poethepoet = "*"
pre-commit = "*"
pytest = "*"
pytest-black = "*"
pytest-mock = "*"
pytest-profiling = "*"
pytest-sugar = "*"
pytest-xdist = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
